<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID and Class Example</title>
</head>

<body>

    <!-- ID -->
    <h1 id="main-heading">Welcome to HTML</h1>

    <!-- Class -->
    <div class="card">
        <h2>Student Information</h2>
        <p class="text">Name: Rohit Prajapati</p>
        <p class="text">Course: B.Tech CSE</p>
        <button class="btn">Submit</button>
    </div>

    <div class="card">
        <h2>Another Card</h2>
        <p class="text">This card uses the same class.</p>
        <button class="btn">Click Me</button>
    </div>
    <script src="script.js"></script>

</body>
</html>
